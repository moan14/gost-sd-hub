const ERR={'Invalid login credentials':'البريد أو كلمة المرور غير صحيحة','User already registered':'البريد مسجّل مسبقًا','Email not confirmed':'أكّد بريدك من الرسالة التي وصلتك أولًا','invalid code':'كود العضوية غير صالح أو مستخدم','request already pending':'لديك طلب قيد المراجعة','attempt limit reached':'وصلت للحد الأقصى (3 محاولات). تواصل مع الإدارة','already verified':'حسابك موثّق مسبقًا','slow down':'انتظر ثانيتين بين الرسائل','duplicate key':'القيمة مستخدمة مسبقًا (مثل اسم المستخدم أو بلاغ مكرر)','violates check constraint':'قيمة غير صالحة','row-level security':'غير مصرّح لك بهذا الإجراء','not allowed':'غير مصرّح لك بهذا الإجراء','leader only':'هذا الإجراء للقائد فقط','code invalid or already used':'الكود غير صالح أو مستخدم — ارفض الطلب','Password should be at least':'كلمة المرور قصيرة (6 أحرف على الأقل)','rate limit':'محاولات كثيرة، انتظر قليلًا','chat is staff only':'الكتابة هنا للإدارة فقط','verified only':'الكتابة هنا للأعضاء الموثّقين فقط','Failed to fetch':'تعذّر الاتصال بالإنترنت'};

const BG={crimson:['قرمزي','#4a0a12'],steel:['فولاذي','#2d3036'],night:['ليلي','#0b1a3a'],forest:['غابة','#0d2f1c']};
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={user:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),news:sv('<path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v10a2 2 0 0 1-2 2"/><path d="M8 8h6M8 12h6M8 16h4"/>'),trophy:sv('<path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 14v4M8 21h8"/>')};

const pub=(b,p)=>sb.storage.from(b).getPublicUrl(p).data.publicUrl;
const K=u=>u.role==='leader'||u.role==='deputy'?'r':u.verified?'g':'y';
const flag=c=>CT[c]?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'';

function avb(u,s=38){const src=u._av||(u.avatar_path?pub('avatars',u.avatar_path):'');
 const dc=u._deco||(u.deco_path?pub('avatars',u.deco_path):'');
 const dec=u.avatar_fx==='fire'?'<i class="fire"></i>':(u.avatar_fx==='img'&&dc?`<img class="fimg" src="${esc(dc)}" alt="">`:'');
 return `<div class="avw ${u.avatar_fx==='hw_pumpkin'?'hwp':u.avatar_fx==='hw_web'?'hww':''}" style="width:${s}px;height:${s}px;font-size:${s}px" onclick="openP('${esc(u.id)}')"><div class="av ${K(u)}" style="width:100%;height:100%">${src?`<img src="${esc(src)}" alt="">`:IC.user}</div>${dec}</div>`}

/* ===== التوجيه والعرض ===== */
async function loadMe(){me=null;if(session)me=ok(await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle())}
function nav(){const t=[['home','الرئيسية'],['news','الأخبار'],['events','الفعاليات'],['members','الأعضاء'],['chat','الشات'],['verify','التوثيق'],['fx','التأثيرات'],['acct',me?'حسابي':'دخول']];if(isStaff())t.push(['admin','الإدارة']);
 $('#nav').innerHTML=t.map(([k,v])=>`<button class="${k===route?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
async function render(){const t=++rt;nav();document.body.classList.toggle('calm',calm);document.body.classList.toggle('hw',hw&&hwOn());$('#app').innerHTML='<p class="mu">جارٍ التحميل…</p>';
 try{const h=await({home:R_home,news:R_news,events:R_events,members:R_members,chat:R_chat,verify:R_verify,fx:R_fx,acct:R_acct,sett:R_sett,prof:R_prof,admin:R_admin,recover:R_recover}[route]||R_home)();if(t!==rt)return;$('#app').innerHTML=h;
  if(route==='chat'&&$('#cb')){subChat();refreshChat().catch(e=>toast(em(e),1))}if(route==='sett')pv()}
 catch(e){if(t!==rt)return;$('#app').innerHTML=`<div class="card"><h3>تعذّر التحميل</h3><p class="mu">${esc(em(e))}</p><button class="btn" onclick="render()">إعادة المحاولة</button></div>`}}
function go(r){route=r;render();scrollTo(0,0)}
function openP(id){pid=id;go('prof')}
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};

/* ===== الصفحات العامة ===== */
const newsCard=n=>`<div class="card">${n.image_path?`<img class="nimg" src="${esc(pub('media',n.image_path))}" alt="">`:`<div class="ico">${IC.news}</div>`}<h3>${esc(n.title)}</h3><div class="mu">${fmt(n.created_at)}</div><p>${esc(n.body)}</p></div>`;
const evImg=e=>e.image_path?`<img class="nimg" src="${esc(pub('media',e.image_path))}" alt="">`:`<div class="ico">${IC.trophy}</div>`;
async function R_home(){const [n,e,m]=await Promise.all([sb.from('news').select('*').order('created_at',{ascending:false}).limit(2),sb.from('events').select('*, event_regs(user_id)').order('starts_at',{ascending:false}).limit(2),sb.from('profiles').select('verified')]);
 const ms=ok(m),ns=ok(n),es=ok(e);
 return `<div class="hero"><h1>كلان 249 GOST SD</h1><p>مجتمع لاعبي Blood Strike: أخبار، بطولات، توثيق للأعضاء وشات خاص بهم.</p>
 <div class="row"><button class="btn" onclick="go('${me?'verify':'acct'}')">انضم إلى الكلان</button><button class="btn g" onclick="go('events')">الفعاليات</button></div>
 <div class="stats"><div class="stat"><b>${ms.length}</b><span>الأعضاء</span></div><div class="stat"><b>${ms.filter(x=>x.verified).length}</b><span>موثّقون</span></div><div class="stat"><b>${es.length}</b><span>فعاليات</span></div></div></div>
 ${hwOn()?`<div class="note">🎃 حدث الهالوين شغّال حتى 30 أكتوبر (متبقٍ ${Math.max(1,Math.ceil((HW1-Date.now())/864e5))} يوم). اختر إطارك وتأثيرك من «تعديل الملف». العناصر تبقى لك بعد انتهاء الحدث، ولغيرك تُقفل.</div>`:`<div class="note">🎃 انتهى حدث الهالوين. عناصره ظاهرة لكنها مقفولة لمن لم يحصل عليها.</div>`}<h2>آخر الأخبار</h2>${ns.map(newsCard).join('')||'<p class="mu">لا أخبار بعد.</p>'}
 <h2>الفعاليات</h2>${es.map(x=>`<div class="card">${evImg(x)}<h3>${esc(x.title)}</h3><div class="mu">${fmt(x.starts_at)} · المسجّلون: ${(x.event_regs||[]).length}</div><p>${esc(x.description)}</p></div>`).join('')||'<p class="mu">لا فعاليات بعد.</p>'}`}
async function R_news(){const d=ok(await sb.from('news').select('*').order('created_at',{ascending:false}));return '<h2>الأخبار</h2>'+(d.map(newsCard).join('')||'<p class="mu">لا أخبار منشورة بعد.</p>')}
async function R_events(){const d=ok(await sb.from('events').select('*, event_regs(user_id, profiles(display_name))').order('starts_at',{ascending:false}));
 return '<h2>البطولات والفعاليات</h2>'+(d.map(e=>{const rg=e.event_regs||[],mine=!!me&&rg.some(r=>r.user_id===me.id);
  return `<div class="card">${evImg(e)}<h3>${esc(e.title)}</h3><div class="mu">${fmt(e.starts_at)}</div><p>${esc(e.description)}</p><p class="mu"><b>القوانين:</b> ${esc(e.rules)}</p>
  <p class="mu"><b>المشاركون (${rg.length}):</b> ${rg.map(r=>esc(r.profiles?.display_name)).join('، ')||'لا أحد بعد'}</p>${e.results?`<p><b>النتائج والفائزون:</b> ${esc(e.results)}</p>`:''}
  <button class="btn ${mine?'g':''}" onclick="reg(${e.id},${mine})">${mine?'إلغاء التسجيل':'سجّل في الفعالية'}</button></div>`}).join('')||'<p class="mu">لا فعاليات حاليًا.</p>')}
function reg(id,mine){act(async()=>{if(!me)return toast('سجّل الدخول أولًا',1);if(!me.verified)return toast('التسجيل للأعضاء الموثّقين فقط',1);
 ok(mine?await sb.from('event_regs').delete().eq('event_id',id).eq('user_id',me.id):await sb.from('event_regs').insert({event_id:id,user_id:me.id}));toast('تم تحديث تسجيلك');render()})}
async function R_members(){const d=ok(await sb.from('profiles').select('*').order('points',{ascending:false}).limit(300));
 return '<h2>الأعضاء</h2>'+d.map(u=>`<div class="card row"><div>${avb(u)}</div><div style="flex:1">${nm(u)} ${bd(u)}<div class="mu">${esc(u.rank_title)} · Lv ${lvl(u).n} · ${u.points} نقطة</div></div></div>`).join('')}

/* ===== الشات ===== */
function msgHtml(m){const u={...m,id:m.user_id};
 return `<div class="msg${me&&me.id===m.user_id?' own':''}">${avb(u)}<div>${nm(u)} ${bd(u)} <span class="badge">${esc(u.rank_title)}</span> <span class="badge">Lv ${lvl(u).n}</span> <span class="mu">${fmt(m.created_at)}</span>${m.audio_path?(AU[m.audio_path]?`<audio controls preload="none" src="${esc(AU[m.audio_path])}" style="max-width:100%"></audio>`:'<span class="mu">🎤 رسالة صوتية</span>'):`<p>${esc(m.body)}</p>`}
 <span class="row">${me&&me.id!==m.user_id?`<button class="btn g s" onclick="rep(${m.id})">إبلاغ</button>`:''}${me&&me.id===m.user_id?`<button class="btn g s" onclick="delOwn(${m.id})">حذف رسالتي</button>`:(isStaff()?`<button class="btn g s" onclick="delm(${m.id})">حذف</button>`:'')}</span></div></div>`}
async function R_chat(){const priv=ct==='pri';
 const tabs=`<div class="tabs"><button class="btn ${priv?'g':''}" onclick="ct='pub';render()">الشات العام</button><button class="btn ${priv?'':'g'}" onclick="ct='pri';render()">شات الأعضاء الموثّقين</button></div>`;
 if(!me)return tabs+`<div class="card"><h3>سجّل الدخول للدخول إلى الشات</h3><button class="btn" onclick="go('acct')">دخول / حساب جديد</button></div>`;
 if(priv&&!me.verified)return tabs+`<div class="card"><h3>الشات الخاص مغلق</h3><p class="mu">يتاح بعد قبول طلب التوثيق من الإدارة.</p><button class="btn" onclick="go('verify')">قدّم طلب التوثيق</button></div>`;
 const cs=(await sb.from('chat_settings').select('*').eq('channel',chan()).maybeSingle()).data||{};
 return tabs+(cs.description?`<div class="note">${esc(cs.description)}</div>`:'')+`<div class="chatw"><div class="chat" id="cb"><p class="mu">جارٍ التحميل…</p></div></div><form onsubmit="sendMsg(event)" class="row"><input name="x" maxlength="300" placeholder="اكتب رسالتك" required style="flex:1;margin:0"><button type="button" class="btn g" id="mic" onclick="toggleRec()">🎤</button><button class="btn">إرسال</button></form>`}
const chan=()=>ct==='pri'?'private':'public';let AU={};
async function refreshChat(){const box=$('#cb');if(!box)return;if([...document.querySelectorAll('#cb audio')].some(a=>!a.paused&&!a.ended))return;const rows=ok(await sb.from('chat_feed').select('*').eq('channel',chan()).eq('deleted',false).order('created_at',{ascending:false}).limit(80)).reverse();
 const kk=rows.map(r=>r.id).join(',');if(box.dataset.k===kk)return;box.dataset.k=kk;
 const ps=rows.filter(r=>r.audio_path).map(r=>r.audio_path);AU={};if(ps.length){const sg=await sb.storage.from('voice').createSignedUrls(ps,3600);(sg.data||[]).forEach(x=>{if(x.signedUrl)AU[x.path]=x.signedUrl})}
 box.innerHTML=rows.map(msgHtml).join('')||'<p class="mu">لا رسائل بعد. ابدأ المحادثة.</p>';box.scrollTop=box.scrollHeight}
function subChat(){if(chatSub)return;setInterval(()=>{if(route==='chat'&&!document.hidden)refreshChat().catch(()=>{})},8000);chatSub=sb.channel('chat-rt').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>{if(route==='chat')refreshChat().catch(()=>{})}).subscribe()}
function sendMsg(e){e.preventDefault();const f=e.target;act(async()=>{const x=f.x.value.trim();if(!x)return;ok(await sb.from('chat_messages').insert({channel:chan(),user_id:me.id,body:x.slice(0,300)}));f.x.value='';await refreshChat()})}
function rep(id){act(async()=>{ok(await sb.from('chat_reports').insert({message_id:id,reporter:me.id}));toast('تم إرسال البلاغ للإدارة')})}
function delm(id){act(async()=>{ok(await sb.rpc('admin_delete_message',{mid:id}));await refreshChat();toast('تم حذف الرسالة')})}

let rec=null,chunks=[],recT=null;
function toggleRec(){act(async()=>{const mic=$('#mic');
 if(rec){rec.stop();return}
 if(!me)return toast('سجّل الدخول أولًا',1);
 if(ct==='pri'&&!me.verified)return toast('غير مصرّح',1);
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('المتصفح لا يدعم التسجيل الصوتي',1);
 const st=await navigator.mediaDevices.getUserMedia({audio:true});
 const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 rec=new MediaRecorder(st,mt?{mimeType:mt}:{});chunks=[];
 rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{clearTimeout(recT);st.getTracks().forEach(t=>t.stop());const r=rec;rec=null;const m2=$('#mic');if(m2)m2.textContent='🎤';
  act(async()=>{const type=(r.mimeType||mt||'audio/webm').split(';')[0],blob=new Blob(chunks,{type});
   if(blob.size<800)return toast('التسجيل قصير جدًا',1);if(blob.size>1024*1024)return toast('التسجيل كبير (الحد 1MB)',1);
   const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm',path=`${chan()}/${me.id}/${Date.now()}.${ext}`;
   ok(await sb.storage.from('voice').upload(path,blob,{contentType:type}));
   const ins=await sb.from('chat_messages').insert({channel:chan(),user_id:me.id,body:'🎤 رسالة صوتية',audio_path:path});
   if(ins.error){await sb.storage.from('voice').remove([path]);throw ins.error}await refreshChat()})};
 rec.start();mic.textContent='⏹ إيقاف';toast('جارٍ التسجيل… اضغط ⏹ للإرسال (حد أقصى 60 ثانية)');recT=setTimeout(()=>{if(rec)rec.stop()},60000)})}
function delOwn(id){act(async()=>{ok(await sb.rpc('delete_own_message',{mid:id}));await refreshChat();toast('تم حذف رسالتك')})}

async function profExtra(id){const day=new Date(Date.now()-864e5).toISOString();
 const [a,b,c]=await Promise.all([sb.from('follows').select('follower',{count:'exact',head:true}).eq('followed',id),sb.from('follows').select('followed',{count:'exact',head:true}).eq('follower',id),sb.from('stories').select('*').eq('user_id',id).gte('created_at',day).order('created_at',{ascending:false})]);
 let iF=null;if(me)iF=(await sb.from('follows').select('followed').eq('follower',me.id).eq('followed',id).maybeSingle()).data;
 return{fc:a.count||0,fg:b.count||0,st:c.data||[],iF}}
function follow(id,on){act(async()=>{ok(on?await sb.from('follows').delete().eq('follower',me.id).eq('followed',id):await sb.from('follows').insert({follower:me.id,followed:id}));render()})}
function addStory(){const i=document.createElement('input');i.type='file';i.accept='image/jpeg,image/png,image/webp';i.onchange=()=>act(async()=>{const f=i.files[0];if(!f)return;if(f.size>3*1024*1024)return toast('الصورة أكبر من 3MB',1);
 const b=await shrink(f,720,false,'image/jpeg',.8),p=`${me.id}/${Date.now()}.jpg`;await up('stories',p,b,'image/jpeg');const cap=(prompt('تعليق (اختياري)')||'').slice(0,120);
 ok(await sb.from('stories').insert({user_id:me.id,image_path:p,caption:cap||null}));toast('تم نشر الاستوري لمدة 24 ساعة');render()});i.click()}
function delStory(id,p){act(async()=>{ok(await sb.from('stories').delete().eq('id',id));sb.storage.from('stories').remove([p]);render()})}
function saveCS(e,ch){const f=fd(e);rpc('admin_chat_settings',{ch,mode:f.m,secs:parseInt(f.s,10)||0,descr:f.d||''},'تم حفظ إعدادات الشات')}
function setMod(id,on){rpc('admin_set_role',{target:id,new_role:on?'mod':'member',title:on?'مشرف':'عضو'},on?'تم تعيين المشرف':'تمت إزالة الإشراف')}

/* ===== التوثيق ===== */
async function R_verify(){if(!me)return `<div class="card"><h3>سجّل الدخول أولًا</h3><button class="btn" onclick="go('acct')">دخول / حساب جديد</button></div>`;
 if(me.verified)return `<div class="card"><h3>حسابك موثّق <span class="badge b-ok">مقبول</span></h3><p class="mu">يمكنك دخول الشات الخاص والتسجيل في الفعاليات.</p></div>`;
 const rs=ok(await sb.from('verification_requests').select('*').eq('user_id',me.id).order('created_at',{ascending:false})),l=rs[0],wait=l&&l.status==='pending';
 const st=l?`<div class="card"><b>حالة الطلب:</b> ${wait?'<span class="badge b-wait">قيد المراجعة</span>':l.status==='rejected'?'<span class="badge b-no">مرفوض</span>':'<span class="badge b-ok">مقبول</span>'}${l.reason?`<p>السبب: ${esc(l.reason)}</p>`:''}</div>`:'';
 const form=wait?'':rs.length>=3?'<p class="mu">وصلت للحد الأقصى من المحاولات (3). تواصل مع الإدارة.</p>':`<form class="card" onsubmit="submitReq(event)"><h3>طلب توثيق العضوية</h3>
 <label>اسم اللاعب</label><input name="pn" required minlength="2" maxlength="30"><label>UID في Blood Strike (أرقام)</label><input name="gid" required inputmode="numeric" pattern="[0-9]{6,15}">
 <label>كود العضوية من الإدارة</label><input name="code" required maxlength="32"><label>صورة إثبات الحساب (JPG/PNG/WebP حتى 5MB)</label><input name="img" type="file" accept="image/jpeg,image/png,image/webp" required>
 <button class="btn">${rs.length?'أعد التقديم':'أرسل الطلب'}</button></form>`;
 return `<h2>توثيق العضوية</h2>${st}${form}`}
function submitReq(e){e.preventDefault();const fm=new FormData(e.target),f=fm.get('img');act(async()=>{
 const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f&&f.type];if(!ext)return toast('ارفع صورة JPG أو PNG أو WebP',1);if(f.size>5*1024*1024)return toast('الصورة أكبر من 5MB',1);
 const path=`${me.id}/${Date.now()}.${ext}`;ok(await sb.storage.from('proofs').upload(path,f,{contentType:f.type}));
 const r=await sb.from('verification_requests').insert({user_id:me.id,player_name:String(fm.get('pn')).trim(),player_uid:String(fm.get('gid')).trim(),code:String(fm.get('code')).trim(),proof_path:path});
 if(r.error){await sb.storage.from('proofs').remove([path]);throw r.error}toast('أُرسل طلبك وهو قيد المراجعة');render()})}

/* ===== الحساب ===== */
async function R_acct(){
 if(me)return `<h2>حسابي</h2><div class="card row">${avb(me,56)}<div><b>${esc(me.display_name)}</b> ${flag(me.country)}<div class="mu">${esc(session.user.email)} · ${esc(me.rank_title)} · ${me.points} نقطة</div>${bd(me)}</div></div>
 <div class="row"><button class="btn" onclick="openP('${me.id}')">ملفي الشخصي</button><button class="btn g" onclick="go('sett')">تعديل الملف</button><button class="btn g" onclick="logout()">تسجيل الخروج</button></div>`;
 return `<div class="grid c2"><form class="card" onsubmit="login(event)"><h3>تسجيل الدخول</h3><label>البريد</label><input name="e" type="email" required autocomplete="email"><label>كلمة المرور</label><input name="p" type="password" required autocomplete="current-password"><button class="btn">دخول</button></form>
 <form class="card" onsubmit="signup(event)"><h3>حساب جديد</h3><label>الاسم المعروض</label><input name="n" required minlength="2" maxlength="24"><label>البريد</label><input name="e" type="email" required autocomplete="email"><label>كلمة المرور (6 أحرف+)</label><input name="p" type="password" minlength="6" required autocomplete="new-password"><button class="btn">إنشاء حساب</button></form></div>
 <form class="card" onsubmit="forgot(event)"><h3>استعادة كلمة المرور</h3><label>بريدك</label><input name="e" type="email" required><button class="btn g">أرسل رابط الاستعادة</button></form>`}
async function R_recover(){return `<form class="card" onsubmit="newPw(event)"><h3>كلمة مرور جديدة</h3><input name="p" type="password" minlength="6" required autocomplete="new-password"><button class="btn">حفظ</button></form>`}
function login(e){const f=fd(e);act(async()=>{ok(await sb.auth.signInWithPassword({email:f.e.trim(),password:f.p}));toast('أهلًا بك');go('home')})}
function signup(e){const f=fd(e);act(async()=>{const r=ok(await sb.auth.signUp({email:f.e.trim(),password:f.p,options:{data:{display_name:f.n.trim()}}}));
 if(!r.session)toast('تم إنشاء الحساب. تحقق من بريدك لتأكيده ثم سجّل الدخول');else{toast('تم إنشاء الحساب');go('verify')}})}
function forgot(e){const f=fd(e);act(async()=>{ok(await sb.auth.resetPasswordForEmail(f.e.trim(),{redirectTo:location.origin+location.pathname}));toast('أرسلنا رابط الاستعادة إلى بريدك')})}
function newPw(e){const f=fd(e);act(async()=>{ok(await sb.auth.updateUser({password:f.p}));toast('تم تغيير كلمة المرور');go('home')})}
function logout(){act(async()=>{await sb.auth.signOut();toast('تم تسجيل الخروج');go('home')})}

/* ===== البروفايل ===== */
async function R_prof(){const p=ok(await sb.from('profiles').select('*').eq('id',pid).maybeSingle());if(!p)return '<p class="mu">الملف غير موجود.</p>';
 const [pi,rg]=await Promise.all([sb.from('player_ids').select('uid,show').eq('user_id',pid).maybeSingle(),sb.from('event_regs').select('created_at,events(title,starts_at)').eq('user_id',pid)]);
 const ui=pi.data,regs=rg.data||[],L=lvl(p),own=me&&me.id===p.id,b=BG[p.bg]||BG.crimson;
 const x0=await profExtra(p.id);
 const ach=[p.verified&&'✔ عضو موثّق',p.points>=1000&&'★ أكثر من 1000 نقطة',regs.length&&'⚔ مشارك في بطولة',p.role==='leader'&&'✦ قائد الكلان',p.role==='deputy'&&'✦ نائب القائد'].filter(Boolean);
 const act2=[...regs.filter(r=>r.events).map(r=>[r.events.starts_at,'سجّل في '+r.events.title]),[p.joined_at,'انضم إلى الكلان']].sort((a,b)=>new Date(b[0])-new Date(a[0]));
 return `<div class="pwrap">${hwFx(p)}<div class="pf pe-${esc(p.entry_fx&&!p.entry_fx.startsWith('hw_')?p.entry_fx:'')}"><div class="ban" style="background:radial-gradient(circle at 80% 0,#ff475733,transparent 50%),linear-gradient(135deg,${b[1]},#0a0a0b)"></div>
 <div class="ph">${avb(p,92)}<div><h1 style="font-size:24px;margin:0">${esc(p.display_name)} ${flag(p.country)}</h1><div class="mu">@${esc(p.username)}</div>${bd(p)}</div></div></div>
 <div class="row" style="margin-bottom:10px"><button class="btn g" onclick="cp(location.origin+location.pathname+'#u${esc(p.id)}')">مشاركة الرابط</button>${ui?`<button class="btn g" onclick="cp('${esc(ui.uid)}')">نسخ UID</button>`:''}${own?`<button class="btn" onclick="go('sett')">تعديل الملف</button>`:''}${me&&!own?`<button class="btn ${x0.iF?'g':''}" onclick="follow('${p.id}',${!!x0.iF})">${x0.iF?'إلغاء المتابعة':'متابعة'}</button>`:''}${own&&me.verified?`<button class="btn g" onclick="addStory()">+ استوري</button>`:''}</div>
 <div class="grid c2"><div class="card"><h3>المستوى ${L.n}</h3><div class="bar"><i style="width:${L.p}%"></i></div><div class="mu">${(p.points||0)%500}/500 للمستوى التالي</div></div>

async function R_sett(){if(!me)return `<div class="card"><button class="btn" onclick="go('acct')">سجّل الدخول</button></div>`;pend={};
 const ui=(await sb.from('player_ids').select('uid,show').eq('user_id',me.id).maybeSingle()).data;
 return `<h2>إعدادات الملف الشخصي</h2><form class="card" id="sf" oninput="pv()" onsubmit="saveS(event)">
 <label>الصورة الشخصية (JPG/PNG/WebP حتى 2MB)</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="pickImg(this,'av')">
 <label>صورة تأثير مخصصة حول الصورة (PNG/WebP شفاف حتى 1MB)</label><input type="file" accept="image/png,image/webp" onchange="pickImg(this,'deco')">
 <label>تأثير الصورة</label><select name="fr"><option value="">بدون</option><option value="fire" ${me.avatar_fx==='fire'?'selected':''}>🔥 نار متحركة</option><option value="img" ${me.avatar_fx==='img'?'selected':''}>صورتي المخصصة</option>${[['hw_pumpkin','🎃 إطار القرع'],['hw_web','🕸️ إطار العنكبوت']].map(f=>`<option value="${f[0]}" ${me.avatar_fx===f[0]?'selected':''} ${hwOk(f[0])?'':'disabled'}>${hwOk(f[0])?f[1]+' (هالوين)':'🔒 '+f[1]+' (انتهى الحدث)'}</option>`).join('')}</select>
 <label>اسم العرض</label><input name="n" value="${esc(me.display_name)}" required minlength="2" maxlength="24">
 <label>اسم المستخدم (إنجليزي/أرقام/_)</label><input name="un" value="${esc(me.username)}" pattern="[A-Za-z0-9_]{3,16}" required>
 <label>الدولة</label><select name="cc"><option value="">بدون</option>${Object.entries(CT).map(([c,n])=>`<option value="${c}" ${me.country===c?'selected':''}>${flag(c)} ${n}</option>`).join('')}</select>
 <label>UID (Blood Strike)</label><input name="gid" value="${esc(ui?.uid||'')}" inputmode="numeric" pattern="[0-9]{6,15}"><label><input type="checkbox" name="su" ${ui?.show?'checked':''} style="width:auto"> إظهار UID للزوار</label>
 <label>النبذة</label><textarea name="bio" rows="2" maxlength="120">${esc(me.bio||'')}</textarea>
 <label>خلفية البروفايل</label><select name="bg">${Object.entries(BG).map(([i,v])=>`<option value="${i}" ${me.bg===i?'selected':''}>${v[0]}</option>`).join('')}</select>
 <label>تأثير يظهر لمن يفتح ملفك</label><select name="pe">${[['','بدون'],['glow','توهج ضوئي'],['slide','انزلاق ناعم'],['flash','ومضة'],['hw_bats','🦇 خفافيش (هالوين)'],['hw_fog','🌫️ ضباب (هالوين)'],['hw_ghost','👻 شبح (هالوين)']].map(p=>`<option value="${p[0]}" ${(me.entry_fx||'')===p[0]?'selected':''} ${p[0].startsWith('hw_')&&!hwOk(p[0])?'disabled':''}>${p[0].startsWith('hw_')&&!hwOk(p[0])?'🔒 '+p[1]+' (انتهى الحدث)':p[1]}</option>`).join('')}</select>
 <label>تأثير الشارة (المتاح لنوع شارتك فقط)</label><select name="fx"><option value="">بدون</option>${FX.filter(f=>f.k===K(me)).map(f=>`<option value="${f.id}" ${me.badge_fx===f.id?'selected':''}>${f.n} — ${f.d}</option>`).join('')}</select>
 <label><input type="checkbox" name="calm" ${calm?'checked':''} style="width:auto"> تقليل الحركة</label>
 <label><input type="checkbox" name="hw" ${hw?'checked':''} style="width:auto"> 🎃 ثيم الهالوين</label>
 <h3>معاينة مباشرة</h3><div id="pv" class="card"></div><button class="btn">حفظ التغييرات</button></form>`}
function pv(){const f=$('#sf');if(!f||!me)return;const d=Object.fromEntries(new FormData(f));
 const t={...me,display_name:d.n||me.display_name,country:d.cc,bio:d.bio,avatar_fx:d.fr||null,_av:pend.avUrl,_deco:pend.decoUrl};
 $('#pv').innerHTML=`<div class="row">${avb(t,56)}<div>${nm(t)} ${bd(t,FX.some(x=>x.id===d.fx&&x.k===K(me))?d.fx:'')}<div class="mu">${esc(t.bio||'')}</div></div></div>`}
function shrink(file,w,sq,type,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);const c=document.createElement('canvas');let sw=im.width,sh=im.height,sx=0,sy=0;
 if(sq){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;c.width=c.height=w}else{c.width=Math.min(w,im.width);c.height=Math.round(im.height*c.width/im.width)}
 c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('صورة غير صالحة')),type,q)};im.onerror=()=>rej(new Error('صورة غير صالحة'));im.src=u})}
function pickImg(i,k){const f=i.files[0];if(!f)return;act(async()=>{
 if(k==='av'){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('ارفع JPG أو PNG أو WebP',1);if(f.size>2*1024*1024)return toast('الصورة أكبر من 2MB',1);
  pend.av=await shrink(f,256,true,'image/jpeg',.85);pend.avUrl=URL.createObjectURL(pend.av)}
 else{if(!/^image\/(png|webp)$/.test(f.type))return toast('ارفع PNG أو WebP',1);if(f.size>1024*1024)return toast('الصورة أكبر من 1MB',1);
  pend.deco=await shrink(f,256,false,'image/png');pend.decoUrl=URL.createObjectURL(pend.deco);const s=$('#sf');if(s&&s.fr)s.fr.value='img'}
 pv()})}
const up=async(b,p,blob,type)=>ok(await sb.storage.from(b).upload(p,blob,{contentType:type,upsert:true}));
function saveS(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));act(async()=>{
 let avatar_path=me.avatar_path,deco_path=me.deco_path;
 if(pend.av){const p=`${me.id}/a_${Date.now()}.jpg`;await up('avatars',p,pend.av,'image/jpeg');if(me.avatar_path)sb.storage.from('avatars').remove([me.avatar_path]);avatar_path=p}
 if(pend.deco){const p=`${me.id}/d_${Date.now()}.png`;await up('avatars',p,pend.deco,'image/png');if(me.deco_path)sb.storage.from('avatars').remove([me.deco_path]);deco_path=p}
 ok(await sb.from('profiles').update({display_name:d.n.trim(),username:d.un.trim(),country:CT[d.cc]?d.cc:null,bio:d.bio.trim()||null,bg:BG[d.bg]?d.bg:'crimson',avatar_fx:['fire','img','hw_pumpkin','hw_web'].includes(d.fr)&&(!d.fr.startsWith('hw_')||hwOk(d.fr))?d.fr:null,entry_fx:['glow','slide','flash','hw_bats','hw_fog','hw_ghost'].includes(d.pe)&&(!d.pe.startsWith('hw_')||hwOk(d.pe))?d.pe:null,badge_fx:d.fx||null,avatar_path,deco_path}).eq('id',me.id));
 if(d.gid)ok(await sb.from('player_ids').upsert({user_id:me.id,uid:d.gid.trim(),show:!!d.su}));else await sb.from('player_ids').delete().eq('user_id',me.id);
 calm=!!d.calm;hw=!!d.hw;try{localStorage.setItem('calm',calm?'1':'0');localStorage.setItem('hw',hw?'1':'0')}catch(x){}
 pend={};await loadMe();toast('تم حفظ التغييرات');openP(me.id)})}

async function R_admin(){if(!isStaff())return '<p class="mu">غير مصرّح.</p>';const L=me.role==='leader';
 const [rq,cd,pf,rp,au]=await Promise.all([sb.from('verification_requests').select('*, profiles!user_id(display_name)').eq('status','pending').order('created_at'),sb.from('membership_codes').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('joined_at'),sb.from('chat_reports').select('id,message_id,created_at,chat_messages(body,channel)').order('created_at',{ascending:false}),sb.from('audit_log').select('*').order('at',{ascending:false}).limit(40)]);
 const reqs=ok(rq),codes=ok(cd),mem=ok(pf),reps=ok(rp),aud=ok(au),ev=ok(await sb.from('events').select('id,title').order('starts_at',{ascending:false}));
 const cs=(await sb.from('chat_settings').select('*')).data||[];

 return `<h2>لوحة الإدارة</h2><div class="stats"><div class="stat"><b>${mem.length}</b><span>أعضاء</span></div><div class="stat"><b>${reqs.length}</b><span>طلبات معلّقة</span></div><div class="stat"><b>${reps.length}</b><span>بلاغات</span></div></div>
 <h2>طلبات التوثيق</h2>${reqs.map((r,i)=>`<div class="card"><b>${esc(r.player_name)}</b> · UID ${esc(r.player_uid)}<div class="mu">الحساب: ${esc(r.profiles?.display_name)} · الكود: ${esc(r.code)}</div>${urls[i]?`<a class="btn g s" href="${esc(urls[i])}" target="_blank" rel="noopener">عرض الإثبات (رابط مؤقت)</a>`:''}
 <div class="row" style="margin-top:6px"><button class="btn ok s" onclick="appr(${r.id})">قبول</button><button class="btn g s" onclick="rej(${r.id})">رفض</button></div></div>`).join('')||'<p class="mu">لا طلبات معلّقة.</p>'}
 <h2>أكواد العضوية</h2><button class="btn" onclick="gen()">إنشاء كود جديد</button><div style="margin-top:8px">${codes.map(c=>`<div class="card row sp"><b dir="ltr">${esc(c.code)}</b><span class="row"><span class="badge ${c.used_by?'b-no':c.active?'b-ok':''}">${c.used_by?'مستخدم':c.active?'فعّال':'معطّل'}</span>${c.used_by?'':`<button class="btn g s" onclick="tg('${esc(c.code)}',${!c.active})">${c.active?'تعطيل':'تفعيل'}</button>`}</span></div>`).join('')}</div>
 <h2>إدارة الأعضاء</h2>${mem.map(u=>`<div class="card"><div class="row sp"><span>${nm(u)}</span>${bd(u)}</div><div class="mu">${esc(u.rank_title)} · ${u.points} نقطة · تحذيرات ${u.warns}${u.banned_until&&new Date(u.banned_until)>new Date()?' · محظور':''}</div>
 ${u.role==='leader'||u.id===me.id?'':`<div class="row" style="margin-top:6px"><button class="btn g s" onclick="pts('${u.id}')">النقاط</button><button class="btn g s" onclick="warn('${u.id}')">تحذير</button><button class="btn g s" onclick="ban('${u.id}')">حظر/رفع</button>${L?`<button class="btn g s" onclick="setMod('${u.id}',true)">تعيين مشرف</button><button class="btn g s" onclick="setMod('${u.id}',false)">إزالة الإشراف</button><button class="btn g s" onclick="role('${u.id}')">الرتبة</button>`:''}</div>`}</div>`).join('')}
 <h2>إعدادات الشات</h2>${cs.map(c=>`<form class="card" onsubmit="saveCS(event,'${c.channel}')"><h3>${c.channel==='public'?'الشات العام':'شات الموثّقين'}</h3><label>من يستطيع الكتابة</label><select name="m"><option value="all" ${c.send_mode==='all'?'selected':''}>الجميع</option><option value="verified" ${c.send_mode==='verified'?'selected':''}>الموثّقون فقط</option><option value="staff" ${c.send_mode==='staff'?'selected':''}>الإدارة فقط (إعلانات)</option></select><label>الفاصل بين الرسائل بالثواني (0 = بدون)</label><input name="s" type="number" min="0" max="300" value="${c.slow_secs}"><label>وصف الشات (يظهر للجميع)</label><input name="d" maxlength="200" value="${esc(c.description||'')}"><button class="btn s">حفظ</button></form>`).join('')}
 <h2>نشر خبر</h2><form class="card" onsubmit="addNews(event)"><input name="t" placeholder="العنوان" required minlength="3" maxlength="80"><textarea name="d" rows="3" placeholder="الوصف" required maxlength="2000"></textarea><label>صورة الخبر (اختياري)</label><input type="file" accept="image/*" onchange="pickMedia(this,'news')"><button class="btn">نشر</button></form>
 <h2>إضافة فعالية</h2><form class="card" onsubmit="addEv(event)"><input name="t" placeholder="اسم الفعالية" required minlength="3" maxlength="80"><input name="date" type="datetime-local" required><textarea name="desc" rows="2" placeholder="الوصف" required maxlength="1000"></textarea><textarea name="rules" rows="2" placeholder="القوانين" required maxlength="2000"></textarea><label>صورة الفعالية (اختياري)</label><input type="file" accept="image/*" onchange="pickMedia(this,'ev')"><button class="btn">إضافة</button></form>
 <h2>نتائج الفعاليات</h2>${ev.map(e=>`<div class="card row sp"><span>${esc(e.title)}</span><button class="btn g s" onclick="res(${e.id})">إدخال النتيجة</button></div>`).join('')||'<p class="mu">لا فعاليات.</p>'}
 <h2>البلاغات</h2>${reps.map(r=>`<div class="card"><div class="mu">${r.chat_messages?esc(r.chat_messages.body):'(رسالة محذوفة)'}</div><div class="row" style="margin-top:6px">${r.chat_messages?`<button class="btn g s" onclick="delm2(${r.message_id})">حذف الرسالة</button>`:''}<button class="btn g s" onclick="closeRep(${r.id})">إغلاق البلاغ</button></div></div>`).join('')||'<p class="mu">لا بلاغات.</p>'}

const rpc=(fn,a,msg)=>act(async()=>{ok(await sb.rpc(fn,a));if(msg)toast(msg);render()});
function appr(id){rpc('approve_request',{rid:id},'تم القبول')}
function rej(id){const t=prompt('سبب الرفض:');if(!t||!t.trim())return toast('اكتب سبب الرفض',1);rpc('reject_request',{rid:id,why:t.trim()},'تم الرفض')}
function gen(){act(async()=>{const c=ok(await sb.rpc('admin_create_code'));toast('الكود الجديد: '+c);render()})}
function tg(c,on){rpc('admin_set_code_active',{c,on_off:on})}
function pts(id){const v=parseInt(prompt('عدد النقاط المضافة (سالب للخصم):'),10);if(isNaN(v))return;rpc('admin_add_points',{target:id,delta:v},'تم')}

 const t=prompt('الرتبة المعروضة (مثال: نائب القائد)');if(!t)return;rpc('admin_set_role',{target:id,new_role:r.trim(),title:t.trim()},'تم تغيير الرتبة')}
function delm2(id){rpc('admin_delete_message',{mid:id},'تم حذف الرسالة')}
function closeRep(id){act(async()=>{ok(await sb.from('chat_reports').delete().eq('id',id));render()})}
function pickMedia(i,k){const f=i.files[0];if(!f)return;act(async()=>{if(!/^image\//.test(f.type))return toast('ارفع ملف صورة',1);if(f.size>3*1024*1024)return toast('الصورة أكبر من 3MB',1);pend[k]=await shrink(f,720,false,'image/jpeg',.8);toast('تم اختيار الصورة')})}
async function upMedia(k){if(!pend[k])return null;const p=`${k}/${Date.now()}.jpg`;await up('media',p,pend[k],'image/jpeg');pend[k]=null;return p}

function addEv(e){const f=fd(e);act(async()=>{const image_path=await upMedia('ev');ok(await sb.from('events').insert({title:f.t.trim(),description:f.desc.trim(),rules:f.rules.trim(),starts_at:new Date(f.date).toISOString(),image_path,created_by:me.id}));toast('تمت الإضافة');render()})}

const APP_VERSION='1.3.0';let dip=null;

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=$('#inst');if(b)b.hidden=false});
